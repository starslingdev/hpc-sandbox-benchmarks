# typos (https://github.com/crate-ci/typos) config. The checker is pinned in mise.toml and run
# via `bun run spell` / `bun run spell:fix`, locally (pre-commit) and in CI. When typos flags an
# intentional identifier, add it under [default.extend-words] rather than rewording the code.

[files]
# The lockfile is generated and full of hashes/identifiers — don't spell-check it. The pts-profiles
# are vendored verbatim from upstream PTS (fetch-profiles dev script) — we must not reword them, so
# any typo in the upstream prose is theirs to keep, not ours to "fix". The dataset is committed run
# output: provider spec probes, request IDs, and verbatim upstream error pages (e.g. a CloudFront
# diagnostic whose token reads as `Ba`) are recorded as-emitted — not ours to reword — so exclude the
# whole tree and anything published from it. LEADERBOARD.md is generated byte-for-byte from those
# records, so it carries the same opaque provider request/machine IDs and must follow the same rule.
extend-exclude = ["bun.lock", "packages/schema/src/pts-profiles/**", "data/dataset/**", "LEADERBOARD.md"]

[default.extend-words]
# Domain term: a parsed result not (yet) in the Metric Catalog. International spelling, used as the
# `uncatalogued` field name and `UncataloguedResult` type throughout the dataset model.
uncatalogued = "uncatalogued"
# The plural of the image format: typos tokenises "PNGs" as PN + Gs and would "correct" the PN
# token to ON, so the token itself is the thing to allow.
PN = "PN"
# POSIX Basic Regular Expression, the grep dialect. Named in lib/probe/isolation/20-collect.sh to
# explain why a match is done in the shell instead of with a `grep` alternation, a GNU extension to BRE.
BRE = "BRE"
# The driver kit's `vendor-output-unparseable` error code (packages/driver/src/lib/errors.ts). The
# code is a literal in a union the harness switches on and rides in persisted run documents, so the
# spelling is a wire-format identifier, not prose to reword.
unparseable = "unparseable"
# Deliberately misspelled fixture key in packages/driver/src/lib/port.test.ts: the test proves that
# `onDeepUndeclaredKey("reject")` catches NESTED misspellings, so the misspelling IS the test input.
memroy = "memroy"

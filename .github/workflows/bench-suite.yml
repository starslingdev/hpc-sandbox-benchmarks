name: Benchmark account batch (reusable)

on:
  workflow_call:
    secrets:
      github-token:
        required: true
      ANTHROPIC_API_KEY: { required: false }
      BL_API_KEY: { required: false }
      BL_WORKSPACE: { required: false }
      BOAT_API_KEY: { required: false }
      BREZEL_API_KEY: { required: false }
      DAYTONA_API_KEY: { required: false }
      E2B_API_KEY: { required: false }
      FIREWORKS_API_KEY: { required: false }
      FREESTYLE_API_KEY: { required: false }
      MODAL_TOKEN_ID: { required: false }
      MODAL_TOKEN_SECRET: { required: false }
      MSB_API_KEY: { required: false }
      NAMESPACE_TENANT_ID: { required: false }
      NOVITA_API_KEY: { required: false }
      NSC_TOKEN: { required: false }
      RUNLOOP_API_KEY: { required: false }
      RUN_CLOUD_API_KEY: { required: false }
      SUBMODULES_PAT: { required: false }
      TAMA_TOKEN: { required: false }
      VERCEL_ORG_ID: { required: false }
      VERCEL_PROJECT_ID: { required: false }
      VERCEL_TOKEN: { required: false }
    inputs:
      account:
        description: 'Frozen account quota domain; one owner schedules all variants in this batch.'
        required: true
        type: string
      providers:
        description: 'JSON array of provider ids owned by this frozen batch, executed in one account pool.'
        required: true
        type: string
      suite:
        description: 'Suite to run — the bench-suite.ts arg and the artifact-name key. A registered SUITE_NAMES value.'
        required: true
        type: string
      batch_id:
        description: 'Immutable experiment batch identity.'
        type: string
        required: true

permissions:
  contents: read

jobs:
  bench:
    if: inputs.account != 'namespace'
    environment: ${{ format('provider-{0}', inputs.account) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: benchmark-account-${{ inputs.account }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 330
    permissions:
      contents: write
      actions: read
    steps: &provider-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
      - name: Validate account boundary
        env:
          ACCOUNT: ${{ inputs.account }}
          # >>> generated: provider-isolation-check — bun run generate-provider-wiring
          FOREIGN_CREDENTIALS: ${{ (inputs.account != 'e2b' && secrets.E2B_API_KEY != '') || (inputs.account != 'daytona' && secrets.DAYTONA_API_KEY != '') || (inputs.account != 'blaxel' && secrets.BL_API_KEY != '') || (inputs.account != 'blaxel' && secrets.BL_WORKSPACE != '') || (inputs.account != 'microsandbox-cloud' && secrets.MSB_API_KEY != '') || (inputs.account != 'modal' && secrets.MODAL_TOKEN_ID != '') || (inputs.account != 'modal' && secrets.MODAL_TOKEN_SECRET != '') || (inputs.account != 'novita' && secrets.NOVITA_API_KEY != '') || (inputs.account != 'runloop' && secrets.RUNLOOP_API_KEY != '') || (inputs.account != 'namespace' && secrets.NAMESPACE_TENANT_ID != '') || (inputs.account != 'vercel' && secrets.VERCEL_ORG_ID != '') || (inputs.account != 'vercel' && secrets.VERCEL_PROJECT_ID != '') || (inputs.account != 'vercel' && secrets.VERCEL_TOKEN != '') || (inputs.account != 'runcloud' && secrets.RUN_CLOUD_API_KEY != '') || (inputs.account != 'tama' && secrets.TAMA_TOKEN != '') || (inputs.account != 'boat' && secrets.BOAT_API_KEY != '') || (inputs.account != 'freestyle' && secrets.FREESTYLE_API_KEY != '') || (inputs.account != 'brezel' && secrets.BREZEL_API_KEY != '') || secrets.NSC_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' || secrets.SUBMODULES_PAT != '' || secrets.FIREWORKS_API_KEY != '' }}
          # <<< end generated: provider-isolation-check
          PROVIDERS: ${{ inputs.providers }}
        run: bun -e 'import { assertProviderAccount } from "@sandbox-benchmarks/schema/provider-ci"; if (process.env.FOREIGN_CREDENTIALS !== "false") throw new Error("Foreign credentials available to provider worker"); assertProviderAccount(process.env.ACCOUNT!, JSON.parse(process.env.PROVIDERS!))'
      - name: Expose artifact runtime to scripts
        uses: ./.github/actions/artifact-runtime

      - name: Set up Namespace credentials
        # >>> generated: preauth-namespace-token-bench — bun run generate-provider-wiring
        if: contains(fromJSON(inputs.providers), 'namespace')
        # <<< end generated: preauth-namespace-token-bench
        id: namespace
        uses: ./.github/actions/namespace-token
        with:
          tenant-id: ${{ secrets.NAMESPACE_TENANT_ID }}
          # batch_id is required: two mixed batches in one run otherwise mint the same
          # suite-run-attempt name and the second job's continue-on-error path left NSC_TOKEN_FILE empty.
          token-name: sandbox-benchmarks-${{ inputs.suite }}-${{ inputs.batch_id }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Require Namespace credentials
        if: contains(fromJSON(inputs.providers), 'namespace')
        env:
          NSC_TOKEN_FILE: ${{ steps.namespace.outputs.token-file }}
        shell: bash
        run: |
          if [ -z "${NSC_TOKEN_FILE}" ] || [ ! -s "${NSC_TOKEN_FILE}" ]; then
            echo "::error::Namespace credential mint failed; refusing to continue without NSC_TOKEN_FILE"
            exit 1
          fi

      - name: Set up the tama CLI
        if: contains(fromJSON(inputs.providers), 'tama')
        uses: ./.github/actions/setup-tama

      - name: Authenticate with Vercel
        # >>> generated: preauth-vercel-auth-bench — bun run generate-provider-wiring
        if: contains(fromJSON(inputs.providers), 'vercel')
        # <<< end generated: preauth-vercel-auth-bench
        id: vercel-auth
        uses: ./.github/actions/vercel-auth
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          org-id: ${{ secrets.VERCEL_ORG_ID }}
          project-id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Run suite and normalize
        env:
          BENCH_REPO_REF: ${{ github.sha }}
          BENCH_REPO_TOKEN: ''
          BENCH_ACCOUNT: ${{ inputs.account }}
          BENCH_BATCH_PROVIDERS: ${{ inputs.providers }}
          BENCH_SUITE: ${{ inputs.suite }}
          BENCH_CELL_BUDGET_MINUTES: '330'
          BENCH_BATCH_ID: ${{ inputs.batch_id }}
          GH_TOKEN: ${{ github.token }}
          # >>> generated: provider-inputs-bench — bun run generate-provider-wiring
          E2B_API_KEY: ${{ contains(fromJSON(inputs.providers), 'e2b') && secrets.E2B_API_KEY || '' }}
          E2B_TEMPLATE: ${{ contains(fromJSON(inputs.providers), 'e2b') && (env.E2B_TEMPLATE || vars.E2B_TEMPLATE) || '' }}
          DAYTONA_API_KEY: ${{ (contains(fromJSON(inputs.providers), 'daytona-vm') || contains(fromJSON(inputs.providers), 'daytona-container')) && secrets.DAYTONA_API_KEY || '' }}
          DAYTONA_TARGET: ${{ contains(fromJSON(inputs.providers), 'daytona-vm') && (env.DAYTONA_TARGET || vars.DAYTONA_TARGET || 'us-west-2') || '' }}
          DAYTONA_SNAPSHOT: ${{ contains(fromJSON(inputs.providers), 'daytona-vm') && (env.DAYTONA_SNAPSHOT || vars.DAYTONA_SNAPSHOT) || '' }}
          DAYTONA_CONTAINER_TARGET: ${{ contains(fromJSON(inputs.providers), 'daytona-container') && (env.DAYTONA_CONTAINER_TARGET || vars.DAYTONA_CONTAINER_TARGET || 'us-west-2') || '' }}
          DAYTONA_CONTAINER_SNAPSHOT: ${{ contains(fromJSON(inputs.providers), 'daytona-container') && (env.DAYTONA_CONTAINER_SNAPSHOT || vars.DAYTONA_CONTAINER_SNAPSHOT) || '' }}
          BL_API_KEY: ${{ contains(fromJSON(inputs.providers), 'blaxel') && secrets.BL_API_KEY || '' }}
          BL_WORKSPACE: ${{ contains(fromJSON(inputs.providers), 'blaxel') && secrets.BL_WORKSPACE || '' }}
          MSB_API_KEY: ${{ contains(fromJSON(inputs.providers), 'microsandbox-cloud') && secrets.MSB_API_KEY || '' }}
          MSB_API_URL: ${{ contains(fromJSON(inputs.providers), 'microsandbox-cloud') && (env.MSB_API_URL || vars.MSB_API_URL) || '' }}
          MODAL_TOKEN_ID: ${{ (contains(fromJSON(inputs.providers), 'modal-gvisor') || contains(fromJSON(inputs.providers), 'modal-vm')) && secrets.MODAL_TOKEN_ID || '' }}
          MODAL_TOKEN_SECRET: ${{ (contains(fromJSON(inputs.providers), 'modal-gvisor') || contains(fromJSON(inputs.providers), 'modal-vm')) && secrets.MODAL_TOKEN_SECRET || '' }}
          NOVITA_API_KEY: ${{ contains(fromJSON(inputs.providers), 'novita') && secrets.NOVITA_API_KEY || '' }}
          NOVITA_TEMPLATE: ${{ contains(fromJSON(inputs.providers), 'novita') && (env.NOVITA_TEMPLATE || vars.NOVITA_TEMPLATE) || '' }}
          RUNLOOP_API_KEY: ${{ contains(fromJSON(inputs.providers), 'runloop') && secrets.RUNLOOP_API_KEY || '' }}
          RUNLOOP_BLUEPRINT: ${{ contains(fromJSON(inputs.providers), 'runloop') && (env.RUNLOOP_BLUEPRINT || vars.RUNLOOP_BLUEPRINT) || '' }}
          NSC_TOKEN_FILE: ${{ steps.namespace.outputs.token-file }}
          VERCEL_OIDC_TOKEN: ${{ contains(fromJSON(inputs.providers), 'vercel') && steps.vercel-auth.outcome == 'success' && env.VERCEL_OIDC_TOKEN || '' }}
          VERCEL_TEAM_SLUG: ${{ contains(fromJSON(inputs.providers), 'vercel') && (env.VERCEL_TEAM_SLUG || vars.VERCEL_TEAM_SLUG) || '' }}
          VERCEL_PROJECT_NAME: ${{ contains(fromJSON(inputs.providers), 'vercel') && (env.VERCEL_PROJECT_NAME || vars.VERCEL_PROJECT_NAME) || '' }}
          RUN_CLOUD_API_KEY: ${{ contains(fromJSON(inputs.providers), 'runcloud') && secrets.RUN_CLOUD_API_KEY || '' }}
          TAMA_TOKEN: ${{ contains(fromJSON(inputs.providers), 'tama') && secrets.TAMA_TOKEN || '' }}
          TAMA_CLI: ${{ contains(fromJSON(inputs.providers), 'tama') && (env.TAMA_CLI || vars.TAMA_CLI) || '' }}
          BOAT_API_KEY: ${{ contains(fromJSON(inputs.providers), 'boat') && secrets.BOAT_API_KEY || '' }}
          BOAT_BASE_URL: ${{ contains(fromJSON(inputs.providers), 'boat') && (env.BOAT_BASE_URL || vars.BOAT_BASE_URL) || '' }}
          FREESTYLE_API_KEY: ${{ contains(fromJSON(inputs.providers), 'freestyle') && secrets.FREESTYLE_API_KEY || '' }}
          BREZEL_API_KEY: ${{ contains(fromJSON(inputs.providers), 'brezel') && secrets.BREZEL_API_KEY || '' }}
          BREZEL_API_URL: ${{ contains(fromJSON(inputs.providers), 'brezel') && (env.BREZEL_API_URL || vars.BREZEL_API_URL) || '' }}
          BREZEL_PROJECT_ID: ${{ contains(fromJSON(inputs.providers), 'brezel') && (env.BREZEL_PROJECT_ID || vars.BREZEL_PROJECT_ID) || '' }}
          BREZEL_ENVIRONMENT_REVISION: ${{ contains(fromJSON(inputs.providers), 'brezel') && (env.BREZEL_ENVIRONMENT_REVISION || vars.BREZEL_ENVIRONMENT_REVISION) || '' }}
          # <<< end generated: provider-inputs-bench
          # >>> generated: provider-runner-lifetime — bun run generate-provider-wiring
          BENCH_RUNNER_LIFETIME_MINUTES: ${{ '' }}
          # <<< end generated: provider-runner-lifetime
        shell: bash
        run: bun apps/cli/src/bin/workflow-experiment.ts execute

      - name: Upload Run + raw results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-${{ inputs.batch_id }}-${{ inputs.account }}-attempt-${{ github.run_attempt }}-${{ github.run_id }}
          path: experiment/attempts/
          if-no-files-found: error

  namespace:
    if: inputs.account == 'namespace'
    environment: ${{ format('provider-{0}', inputs.account) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: benchmark-account-${{ inputs.account }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 330
    permissions:
      contents: write
      actions: read
      id-token: write
    steps: *provider-steps

name: Provider release boundary
on:
  workflow_call:
    inputs:
      account:
        type: string
        required: true
      provider:
        type: string
        required: true
      required:
        type: boolean
        required: true
      phase:
        type: string
        required: true
      base-image:
        type: string
        required: true
      partial:
        type: boolean
        required: true
      force:
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  execute:
    permissions:
      contents: read
      packages: read
      id-token: write
    # The entry workflow passes no secrets into this intermediary.
    secrets: inherit # zizmor: ignore[secrets-inherit] CI enforces an empty incoming secret context.
    uses: ./.github/workflows/provider-release-worker.yml
    with:
      account: ${{ inputs.account }}
      provider: ${{ inputs.provider }}
      required: ${{ inputs.required }}
      phase: ${{ inputs.phase }}
      base-image: ${{ inputs.base-image }}
      partial: ${{ inputs.partial }}
      force: ${{ inputs.force }}

name: Commit dataset

# Aggregate a Bench matrix run's per-cell shards into one candidate, gate it (promote), and commit the
# promoted dataset JSON onto main. This is the purely-mechanical half of the old publish-dataset.yml:
# it lands data/dataset/ (the machine-readable Run + newest-first index) and nothing human-facing — the
# public LEADERBOARD.md is regenerated deliberately by update-leaderboard.yml, so the dataset can
# accumulate one committed run per matrix run without churning the comparison surface every time.
#
# Two entry points:
#   - workflow_call: bench-matrix.yml invokes it at the end of a matrix run (run_id = that run).
#   - workflow_dispatch: a maintainer re-runs it standalone to BACKFILL a run whose commit failed —
#     pass the old run's id, and its still-retained bench-* shard artifacts are re-aggregated and
#     committed. (Artifacts expire on the repo's retention window, so backfill only works while the
#     shards still exist.)
#
# Environment `privileged` lives on the job here (the dataset release surface, `contents: write`); a
# `uses:` caller can't declare it, so the approval gate is enforced at this layer for both entry points.
on:
  workflow_call:
    inputs:
      run_id:
        description: 'Bench matrix run id whose shard artifacts to aggregate + commit.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Previous Bench matrix run id to backfill the dataset from (its bench-* shard artifacts must still be retained).'
        required: true
        type: string

# Least privilege at the top level; the commit job elevates for exactly what it needs.
permissions:
  contents: read

# Serialize ALL dataset commits under the original global group. Keep the legacy `publish-dataset` key
# across the workflow rename so a run already active on the old workflow cannot overlap a new run and
# race the shared newest-first data/dataset/index.json. Do NOT key this on run_id — commits for different
# runs would then build competing PRs from the same base. cancel-in-progress: false protects the running
# commit; GitHub still keeps only the latest PENDING run per group, so on the rare pile-up (bench-matrix
# serializes matrix runs on main, and backfills are manual) an evicted pending run is recovered by
# re-dispatching its backfill.
concurrency:
  group: publish-dataset
  cancel-in-progress: false

jobs:
  commit:
    name: Aggregate + promote dataset
    # Confine the release to this repo's main, whether called by the matrix or dispatched to backfill.
    # (Environment `privileged`'s deployment-branch policy pins it to main too; this is defense in depth.)
    if: >
      github.ref == 'refs/heads/main' &&
      github.repository == 'starslingdev/hpc-sandbox-benchmarks'
    runs-on: ubuntu-24.04
    environment: privileged
    # contents: write to commit + push the dataset branch; pull-requests: write to open the PR;
    # actions: read to download another run's shard artifacts by run-id (the backfill path).
    permissions:
      contents: write
      pull-requests: write
      actions: read
    # The target run id (this run for the matrix call, an older run for a backfill) reaches the shell
    # only through the environment, never interpolated into a `run:` command.
    env:
      RUN_ID: ${{ inputs.run_id }}
    steps:
      # Unlike the read-only bench jobs, this one commits + `git push`es the promoted dataset, so it
      # keeps the default persisted job token (contents: write above authorizes it). Don't add
      # persist-credentials: false here or the push at the end of the job loses its credentials.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      # Pull every per-cell shard artifact for the target run into ./shards (each in its own subdir).
      # run-id + github-token make this work across runs: for a matrix call run-id is the current run,
      # for a backfill it is the older run whose commit failed. (Downloading by run-id needs the
      # actions: read scope granted above.)
      - name: Download shard artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: shards
          pattern: bench-*-${{ inputs.run_id }}
          merge-multiple: false
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      # Aggregate the shards' Run documents into one candidate, then promote (gate on >=1 validated
      # provider) and publish into the committed dataset at data/dataset/. The run-id matches the shards.
      #
      # The globs name the Run documents EXACTLY and must not gain a `data/` segment: the bench cell
      # uploads `path: data/`, and upload-artifact roots the artifact at the least common ancestor of the
      # matched files — so a shard unpacks as `shards/<artifact>/runs/<runId>...json`, with no `data/`
      # prefix. Two decoys sit next to them that a `runs/*.json` wildcard would sweep in: the sibling
      # `runs/index.json` (an index, not a Run), and `dataset/runs/<oldRunId>.json` (the committed
      # dataset, which rides along because it lives under data/, and which the `runs/` segment excludes).
      # Both would poison the aggregate.
      #
      # TWO shard shapes exist, and they are selected with a PREFERENCE, never unioned:
      #   * `<runId>-r<idx>.json` — the current per-replicate shards (one runner drives all R replicates
      #     of a (suite, provider) cell, so they share an artifact and are told apart by the suffix).
      #   * `<runId>.json` — the un-suffixed single-shard name written by a run that predates the
      #     fan-out change. Keeping it is what lets a backfill dispatch re-aggregate an older run's
      #     still-retained artifacts.
      #
      # Preference, not union, because run ids are PRESERVED across re-runs: a run whose first attempt
      # predates the change and whose retry postdates it leaves BOTH shapes under one run id. Unioning
      # them would hand `aggregate` two shards describing the SAME sandbox — a shard with no
      # replicateIndex normalizes to index 0, colliding with `-r0` — and its documented first-wins
      # rule would silently drop one sandbox's whole measured set while leaving no replicate breakdown,
      # making the result indistinguishable from a genuine single-replicate run.
      #
      # The preference is applied PER CELL, never run-wide, because the collision it guards against is
      # per-cell: the two shapes describe the same sandbox only when they came from the same
      # (suite, provider) artifact. `merge-multiple: false` above unpacks each cell into its own
      # `shards/<artifact>/` subdir, so that subdir IS the cell boundary — loop over it and ask each cell
      # which shape it wrote. A run-wide preference reads the shapes as a single global choice, and a
      # mixed-shape run (retry a cell that failed on the old code, and only that cell re-runs on the new)
      # then publishes ONLY the retried cell: every other provider/suite of the run, still legacy-only,
      # is silently discarded and the dataset is promoted a fraction of the size it should be. Per cell,
      # the retried cell contributes its `-r<idx>` fleet and its untouched peers contribute their legacy
      # shard, which is the union across cells and the preference within one — exactly the intent.
      #
      # (Both shapes under ONE cell needs `overwrite: true` on the cell's upload — see bench-suite.yml —
      # to be reachable at all, since a re-run otherwise cannot claim the name. The per-cell preference
      # is the belt to that suspenders: it stays correct for artifacts uploaded before that fix and for
      # a backfill dispatch reaching back to any older run.)
      #
      # The per-shape cell counts are echoed so a short or lopsided set is visible in the log rather
      # than inferred.
      - name: Aggregate + promote
        run: |
          shopt -s nullglob
          shards=()
          fanout_cells=0
          legacy_cells=0
          for cell in shards/*/; do
            # The `-r*` probe is a real glob, so nullglob empties it when the cell wrote no fleet. The
            # legacy name has NO wildcard left once "$cell" is an expanded literal, and nullglob only
            # ever rewrites words that ARE patterns — so it must be probed with `-f`, or every cell
            # would contribute a non-existent path and be miscounted as legacy.
            cell_shards=("$cell"runs/"$RUN_ID"-r*.json)
            if [ ${#cell_shards[@]} -gt 0 ]; then
              fanout_cells=$((fanout_cells + 1))
            elif [ -f "$cell"runs/"$RUN_ID".json ]; then
              cell_shards=("$cell"runs/"$RUN_ID".json)
              legacy_cells=$((legacy_cells + 1))
            else
              cell_shards=()
            fi
            shards+=("${cell_shards[@]}")
          done
          if [ ${#shards[@]} -eq 0 ]; then echo "no shard Run documents found for run $RUN_ID" >&2; exit 1; fi
          echo "aggregating ${#shards[@]} shard(s) for run $RUN_ID" \
            "from $fanout_cells per-replicate + $legacy_cells legacy single-shard cell(s)"
          bun apps/cli/src/bin/aggregate.ts "$RUN_ID" data/candidate "${shards[@]}"
          bun apps/cli/src/bin/promote.ts "data/candidate/runs/$RUN_ID.json" data/dataset

      # Canonicalize the promoted dataset to Biome's format before the gate + commit. The promote
      # writer emits `JSON.stringify(run, null, 2)` (every array element on its own line), but Biome's
      # JSON formatter inlines short arrays and wraps long ones at the 100-col width — so the committed
      # dataset is in Biome's shape and a raw Run document fails `biome check .` on the PR. Autofixing
      # the mechanical formatting here is exactly what a developer's `bun run lint:fix` would do. Scope
      # the write to data/dataset (JSON only): this job never touches LEADERBOARD.md, and Biome leaves
      # any rendered Markdown untouched anyway.
      #
      # A Run document grows with every provider x suite x metric the matrix gains, and Biome SKIPS any
      # file over `files.maxSize` — emitting a warning that `--error-on-warnings` below turns into a job
      # failure (run 30322186937 died this way at 2.2 MiB against the 2 MiB project cap, and the autofix
      # silently no-op'd on the very file it exists to format). `biome.json` therefore carries a
      # `data/dataset/runs/*.json` override raising the cap to 16 MiB for these generated documents only;
      # hand-written source keeps the strict project-wide cap. Note biome.json cannot hold comments —
      # Biome silently discards a commented config and falls back to its defaults — hence this note here.
      - name: Autofix the promoted dataset formatting (Biome)
        run: bunx biome check data/dataset --write

      # Confirm the committed content passes the exact gate ci.yml runs (`biome check .`), scoped to the
      # files this job writes. After the autofix above this should pass; if anything Biome can't fix
      # mechanically remains, fail the job early (before any PR is opened) rather than leave a doomed PR.
      # A pre-existing, unrelated lint failure elsewhere on main can't strand a clean dataset commit;
      # the PR's own `biome check .` still gates the merge.
      - name: Confirm the promoted dataset passes Biome (the PR lint gate)
        run: bunx biome check data/dataset --error-on-warnings

      # main is protected by a "changes must be made through a pull request" ruleset (the public-repo
      # hardening in #176/#177), so this job can't push the promoted dataset straight to main — a direct
      # push is rejected with GH013. Commit through a short-lived branch + pull request as the
      # github-actions bot, then merge it. The merge never bypasses the ruleset: it succeeds only
      # because the ruleset requires no status checks and code-owner review is its sole review
      # requirement, with data/dataset/ intentionally unowned (see docs/ci-secrets.md operator setup);
      # the in-job Biome pre-flight above already guarantees the content is clean.
      - name: Commit the dataset via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dataset
          if git diff --cached --quiet; then
            echo "dataset for run $RUN_ID unchanged; nothing to commit"
            exit 0
          fi
          branch="dataset/publish-${RUN_ID}"
          # Always (re)build the bot branch from the freshly promoted dataset and force-push FIRST, so a
          # re-run (retried matrix run, or a re-dispatched backfill) refreshes an already-open PR rather
          # than leaving it stale if the aggregated content changed since it was opened. `-C` resets the
          # local branch to this run's HEAD; `--force` overwrites the bot-owned remote branch (a no-op when
          # the content is unchanged).
          git switch -C "$branch"
          git commit -m "chore(dataset): commit run ${RUN_ID}"
          git push -u --force origin "$branch"
          # Pin the exact commit this run validated: the merge below passes it via --match-head-commit,
          # so a concurrent push that swaps the branch head between now and the merge fails the merge
          # instead of landing content this run never checked.
          head_sha="$(git rev-parse HEAD)"
          # Open the PR only if one isn't already open for this deterministic branch; a re-run reuses it
          # (the force-push above already refreshed its content). `gh pr create` fails outright (GraphQL
          # "GitHub Actions is not permitted to create or approve pull requests") when the repo's Settings →
          # Actions → General → Workflow permissions → "Allow GitHub Actions to create and approve pull
          # requests" toggle is off — see docs/ci-secrets.md. The dataset branch is already pushed at that
          # point, so surface the fix instead of a bare GraphQL error before failing the job.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            if ! gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(dataset): commit run ${RUN_ID}" \
              --body "Automated dataset commit for run [\`${RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}). Biome was pre-flighted green on the promoted content; the workflow merges this PR directly right after opening it (data/dataset/ is unowned, so no review rules apply — if this PR is still open, that merge failed and a maintainer must finish it). The public LEADERBOARD.md is regenerated separately via the Update leaderboard workflow."; then
              echo "::error::gh pr create failed — branch '$branch' was pushed but no PR was opened." \
                "This is almost always the repo's 'Allow GitHub Actions to create and approve pull" \
                "requests' setting being off (Settings → Actions → General → Workflow permissions)." \
                "A maintainer must either enable it and re-dispatch this workflow with run_id=$RUN_ID," \
                "or open the PR for '$branch' manually. See docs/ci-secrets.md."
              exit 1
            fi
          fi
          # Merge as the bot with a direct merge — deliberately NOT `gh pr merge --auto`. On a
          # GITHUB_TOKEN-authored PR a required status check never runs, so if one were ever added,
          # `--auto` would exit 0 after merely ARMING auto-merge for a merge that can never complete —
          # a green publish job hiding a forever-open dataset PR. A direct merge either lands the PR
          # right now (today's posture: no required checks, and data/dataset/ is unowned so no
          # code-owner review applies) or fails this job red. GitHub still enforces the ruleset on the
          # merge call — this is not a bypass.
          if ! gh pr merge "$branch" --squash --delete-branch --match-head-commit "$head_sha"; then
            echo "::error::could not merge '$branch'. The ruleset blocks it (unresolved review" \
              "thread, a required review, or a required status check — which a GITHUB_TOKEN-authored" \
              "PR can never run; landing bot PRs under required checks needs an App/PAT, see" \
              "docs/ci-secrets.md). A maintainer must finish the merge. Do NOT add github-actions as" \
              "a ruleset bypass — prefer: required approving review count 0 + Require review from" \
              "Code Owners, with data/dataset/ unowned."
            exit 1
          fi

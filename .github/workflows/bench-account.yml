name: Benchmark account wave (reusable)
on:
  workflow_call:
    inputs:
      account:
        type: string
        required: true
      wave:
        description: 'synthetic-memory, synthetic-system, or realworld — the ordered CPU matrix waves'
        type: string
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      axis: ${{ steps.plan.outputs.axis }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace
      - name: Read frozen account wave axis
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BENCH_ACCOUNT: ${{ inputs.account }}
          BENCH_WAVE: ${{ inputs.wave }}
        run: bun apps/cli/src/bin/workflow-experiment.ts axes "$BENCH_ACCOUNT" "$BENCH_WAVE"
  execute:
    needs: plan
    # Accounts with no cells in this wave emit an empty axis; skip rather than failing the matrix.
    if: needs.plan.outputs.axis != '[]'
    permissions:
      contents: write
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      # No max-parallel: account exclusion is the suite job concurrency group, so every batch in this
      # wave may be created together for one privileged approval. ROUND_BATCH_LIMIT keeps a released
      # wave under the 100-job queue:max ceiling.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.axis) }}
    secrets:
      # >>> generated: environment-secret-arguments — bun run generate-provider-wiring
      E2B_API_KEY: ${{ inputs.account == 'e2b' && 'environment-only' || '' }}
      DAYTONA_API_KEY: ${{ inputs.account == 'daytona' && 'environment-only' || '' }}
      BL_API_KEY: ${{ inputs.account == 'blaxel' && 'environment-only' || '' }}
      BL_WORKSPACE: ${{ inputs.account == 'blaxel' && 'environment-only' || '' }}
      MSB_API_KEY: ${{ inputs.account == 'microsandbox-cloud' && 'environment-only' || '' }}
      MODAL_TOKEN_ID: ${{ inputs.account == 'modal' && 'environment-only' || '' }}
      MODAL_TOKEN_SECRET: ${{ inputs.account == 'modal' && 'environment-only' || '' }}
      NOVITA_API_KEY: ${{ inputs.account == 'novita' && 'environment-only' || '' }}
      RUNLOOP_API_KEY: ${{ inputs.account == 'runloop' && 'environment-only' || '' }}
      NAMESPACE_TENANT_ID: ${{ inputs.account == 'namespace' && 'environment-only' || '' }}
      VERCEL_ORG_ID: ${{ inputs.account == 'vercel' && 'environment-only' || '' }}
      VERCEL_PROJECT_ID: ${{ inputs.account == 'vercel' && 'environment-only' || '' }}
      VERCEL_TOKEN: ${{ inputs.account == 'vercel' && 'environment-only' || '' }}
      RUN_CLOUD_API_KEY: ${{ inputs.account == 'runcloud' && 'environment-only' || '' }}
      TAMA_TOKEN: ${{ inputs.account == 'tama' && 'environment-only' || '' }}
      BOAT_API_KEY: ${{ inputs.account == 'boat' && 'environment-only' || '' }}
      FREESTYLE_API_KEY: ${{ inputs.account == 'freestyle' && 'environment-only' || '' }}
      BREZEL_API_KEY: ${{ inputs.account == 'brezel' && 'environment-only' || '' }}
      # <<< end generated: environment-secret-arguments
    uses: ./.github/workflows/bench-suite.yml
    with:
      account: ${{ inputs.account }}
      providers: ${{ toJSON(matrix.providers) }}
      suite: ${{ matrix.suite }}
      batch_id: ${{ matrix.batch }}

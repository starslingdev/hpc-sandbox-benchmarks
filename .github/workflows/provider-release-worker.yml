# Isolated provider staging. Only the Namespace job grants OIDC.
name: Isolated provider release worker
on:
  workflow_call:
    inputs:
      account:
        type: string
        required: true
      provider:
        type: string
        required: true
      required:
        type: boolean
        required: true
      phase:
        type: string
        required: true
      base-image:
        type: string
        required: true
      partial:
        type: boolean
        required: true
      force:
        type: boolean
        required: true
permissions:
  contents: read

jobs:
  release:
    if: inputs.account != 'namespace'
    environment: ${{ format('provider-{0}', inputs.account) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: benchmark-account-${{ inputs.account }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps: &provider-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          buildx: 'true'
      - name: Validate account boundary
        env:
          ACCOUNT: ${{ inputs.account }}
          # >>> generated: provider-isolation-check — bun run generate-provider-wiring
          FOREIGN_CREDENTIALS: ${{ (inputs.account != 'e2b' && secrets.E2B_API_KEY != '') || (inputs.account != 'daytona' && secrets.DAYTONA_API_KEY != '') || (inputs.account != 'blaxel' && secrets.BL_API_KEY != '') || (inputs.account != 'blaxel' && secrets.BL_WORKSPACE != '') || (inputs.account != 'microsandbox-cloud' && secrets.MSB_API_KEY != '') || (inputs.account != 'modal' && secrets.MODAL_TOKEN_ID != '') || (inputs.account != 'modal' && secrets.MODAL_TOKEN_SECRET != '') || (inputs.account != 'novita' && secrets.NOVITA_API_KEY != '') || (inputs.account != 'runloop' && secrets.RUNLOOP_API_KEY != '') || (inputs.account != 'namespace' && secrets.NAMESPACE_TENANT_ID != '') || (inputs.account != 'vercel' && secrets.VERCEL_ORG_ID != '') || (inputs.account != 'vercel' && secrets.VERCEL_PROJECT_ID != '') || (inputs.account != 'vercel' && secrets.VERCEL_TOKEN != '') || (inputs.account != 'runcloud' && secrets.RUN_CLOUD_API_KEY != '') || (inputs.account != 'tama' && secrets.TAMA_TOKEN != '') || (inputs.account != 'boat' && secrets.BOAT_API_KEY != '') || (inputs.account != 'freestyle' && secrets.FREESTYLE_API_KEY != '') || (inputs.account != 'brezel' && secrets.BREZEL_API_KEY != '') || secrets.E2B_API_KEY == 'environment-only' || secrets.DAYTONA_API_KEY == 'environment-only' || secrets.BL_API_KEY == 'environment-only' || secrets.BL_WORKSPACE == 'environment-only' || secrets.MSB_API_KEY == 'environment-only' || secrets.MODAL_TOKEN_ID == 'environment-only' || secrets.MODAL_TOKEN_SECRET == 'environment-only' || secrets.NOVITA_API_KEY == 'environment-only' || secrets.RUNLOOP_API_KEY == 'environment-only' || secrets.NAMESPACE_TENANT_ID == 'environment-only' || secrets.VERCEL_ORG_ID == 'environment-only' || secrets.VERCEL_PROJECT_ID == 'environment-only' || secrets.VERCEL_TOKEN == 'environment-only' || secrets.RUN_CLOUD_API_KEY == 'environment-only' || secrets.TAMA_TOKEN == 'environment-only' || secrets.BOAT_API_KEY == 'environment-only' || secrets.FREESTYLE_API_KEY == 'environment-only' || secrets.BREZEL_API_KEY == 'environment-only' || secrets.NSC_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' || secrets.SUBMODULES_PAT != '' || secrets.FIREWORKS_API_KEY != '' }}
          # <<< end generated: provider-isolation-check
          PROVIDER: ${{ inputs.provider }}
          PHASE: ${{ inputs.phase }}
        run: bun -e 'import { assertProviderAccount } from "@sandbox-benchmarks/schema/provider-ci"; if (process.env.FOREIGN_CREDENTIALS !== "false") throw new Error("Foreign credentials available to provider worker"); assertProviderAccount(process.env.ACCOUNT!, [process.env.PROVIDER!]); if (!["bake", "promote"].includes(process.env.PHASE!)) throw new Error("Invalid release phase")'
      - name: GHCR session for Blaxel remote build
        if: inputs.provider == 'blaxel'
        uses: ./.github/actions/ghcr-login
        with:
          token: ${{ github.token }}
      - name: Set up Blaxel CLI
        if: inputs.provider == 'blaxel'
        uses: ./.github/actions/setup-blaxel-cli
      - name: Set up Namespace credentials
        # >>> generated: preauth-namespace-token-release — bun run generate-provider-wiring
        if: inputs.provider == 'namespace'
        # <<< end generated: preauth-namespace-token-release
        continue-on-error: true
        id: namespace
        uses: ./.github/actions/namespace-token
        with:
          tenant-id: ${{ secrets.NAMESPACE_TENANT_ID }}
          token-name: sandbox-benchmarks-toolchain-${{ inputs.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Authenticate with Vercel and VCR
        # >>> generated: preauth-vercel-auth-release — bun run generate-provider-wiring
        if: inputs.provider == 'vercel'
        # <<< end generated: preauth-vercel-auth-release
        continue-on-error: true
        id: vercel-auth
        uses: ./.github/actions/vercel-auth
        with:
          token: ${{ secrets.VERCEL_TOKEN }}
          org-id: ${{ secrets.VERCEL_ORG_ID }}
          project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vcr-login: "true"
      - name: Mirror the toolchain base into VCR
        if: inputs.phase == 'bake' && inputs.provider == 'vercel' && steps.vercel-auth.outcome == 'success'
        id: vercel-vcr
        env:
          SOURCE_REF: ${{ inputs.base-image }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          target_ref="$(bun -e 'import { config } from "@sandbox-benchmarks/providers"; console.log(config.vercelImageCandidate)')"
          project="$(bun -e 'import { config } from "@sandbox-benchmarks/providers"; console.log(config.vercelProjectName)')"
          target_name="${target_ref##*/}"
          echo ">>> mirroring $SOURCE_REF into VCR as $target_ref"
          docker pull "$SOURCE_REF"
          docker tag "$SOURCE_REF" "$target_ref"
          # --project pins the destination to the SAME resolved name the target ref was built from.
          # Without it the push silently follows whatever project VERCEL_PROJECT_ID linked, so a
          # mismatched VERCEL_PROJECT_NAME would tag one repository and publish into another — and the
          # digest read back below would describe an image the providers never pull.
          # --token explicitly rather than relying on the CLI's env pickup: one documented contract,
          # and it fails loudly here rather than silently falling back to some ambient session.
          ./node_modules/.bin/vercel vcr push docker "$target_name" --project "$project" --token="$VERCEL_TOKEN"
          digest="$(docker buildx imagetools inspect "$target_ref" --format '{{json .Manifest.Digest}}' | jq -er '.')"
          echo "digest-ref=${target_ref%:*}@${digest}" >> "$GITHUB_OUTPUT"
      - name: Log out of VCR after mirror
        if: inputs.provider == 'vercel' && steps.vercel-vcr.outcome == 'success'
        shell: bash
        run: docker logout vcr.vercel.com
      - name: Pin VCR candidate for promotion
        if: inputs.phase == 'promote' && inputs.provider == 'vercel' && steps.vercel-auth.outcome == 'success'
        id: vercel-pinned
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(bun -e 'import { config } from "@sandbox-benchmarks/providers/config"; console.log(config.vercelImageCandidate)')"
          digest="$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest.Digest}}' | jq -er '.')"
          echo "digest-ref=${candidate%:*}@${digest}" >> "$GITHUB_OUTPUT"
      - name: Bake + verify candidate
        id: bake
        env:
          PHASE: ${{ inputs.phase }}
          RELEASE_PARTIAL: ${{ inputs.partial }}
          RELEASE_FORCE: ${{ inputs.force }}
          RELEASE_SOURCE_REF: ${{ github.sha }}
          PROVIDER: ${{ inputs.provider }}
          REQUIRED: ${{ inputs.required }}
          BASE_IMAGE_REF: ${{ inputs.base-image }}
          # >>> generated: provider-inputs-release — bun run generate-provider-wiring
          E2B_API_KEY: ${{ inputs.provider == 'e2b' && secrets.E2B_API_KEY || '' }}
          E2B_TEMPLATE: ${{ inputs.provider == 'e2b' && (env.E2B_TEMPLATE || vars.E2B_TEMPLATE) || '' }}
          DAYTONA_API_KEY: ${{ (inputs.provider == 'daytona-vm' || inputs.provider == 'daytona-container') && secrets.DAYTONA_API_KEY || '' }}
          DAYTONA_TARGET: ${{ inputs.provider == 'daytona-vm' && (env.DAYTONA_TARGET || vars.DAYTONA_TARGET || 'us-west-2') || '' }}
          DAYTONA_SNAPSHOT: ${{ inputs.provider == 'daytona-vm' && (env.DAYTONA_SNAPSHOT || vars.DAYTONA_SNAPSHOT) || '' }}
          DAYTONA_CONTAINER_TARGET: ${{ inputs.provider == 'daytona-container' && (env.DAYTONA_CONTAINER_TARGET || vars.DAYTONA_CONTAINER_TARGET || 'us-west-2') || '' }}
          DAYTONA_CONTAINER_SNAPSHOT: ${{ inputs.provider == 'daytona-container' && (env.DAYTONA_CONTAINER_SNAPSHOT || vars.DAYTONA_CONTAINER_SNAPSHOT) || '' }}
          BL_API_KEY: ${{ inputs.provider == 'blaxel' && secrets.BL_API_KEY || '' }}
          BL_WORKSPACE: ${{ inputs.provider == 'blaxel' && secrets.BL_WORKSPACE || '' }}
          MSB_API_KEY: ${{ inputs.provider == 'microsandbox-cloud' && secrets.MSB_API_KEY || '' }}
          MSB_API_URL: ${{ inputs.provider == 'microsandbox-cloud' && (env.MSB_API_URL || vars.MSB_API_URL) || '' }}
          MODAL_TOKEN_ID: ${{ (inputs.provider == 'modal-gvisor' || inputs.provider == 'modal-vm') && secrets.MODAL_TOKEN_ID || '' }}
          MODAL_TOKEN_SECRET: ${{ (inputs.provider == 'modal-gvisor' || inputs.provider == 'modal-vm') && secrets.MODAL_TOKEN_SECRET || '' }}
          NOVITA_API_KEY: ${{ inputs.provider == 'novita' && secrets.NOVITA_API_KEY || '' }}
          NOVITA_TEMPLATE: ${{ inputs.provider == 'novita' && (env.NOVITA_TEMPLATE || vars.NOVITA_TEMPLATE) || '' }}
          RUNLOOP_API_KEY: ${{ inputs.provider == 'runloop' && secrets.RUNLOOP_API_KEY || '' }}
          RUNLOOP_BLUEPRINT: ${{ inputs.provider == 'runloop' && (env.RUNLOOP_BLUEPRINT || vars.RUNLOOP_BLUEPRINT) || '' }}
          NSC_TOKEN_FILE: ${{ steps.namespace.outputs.token-file }}
          VERCEL_OIDC_TOKEN: ${{ inputs.provider == 'vercel' && steps.vercel-auth.outcome == 'success' && env.VERCEL_OIDC_TOKEN || '' }}
          VERCEL_TEAM_SLUG: ${{ inputs.provider == 'vercel' && (env.VERCEL_TEAM_SLUG || vars.VERCEL_TEAM_SLUG) || '' }}
          VERCEL_PROJECT_NAME: ${{ inputs.provider == 'vercel' && (env.VERCEL_PROJECT_NAME || vars.VERCEL_PROJECT_NAME) || '' }}
          RUN_CLOUD_API_KEY: ${{ inputs.provider == 'runcloud' && secrets.RUN_CLOUD_API_KEY || '' }}
          TAMA_TOKEN: ${{ inputs.provider == 'tama' && secrets.TAMA_TOKEN || '' }}
          TAMA_CLI: ${{ inputs.provider == 'tama' && (env.TAMA_CLI || vars.TAMA_CLI) || '' }}
          BOAT_API_KEY: ${{ inputs.provider == 'boat' && secrets.BOAT_API_KEY || '' }}
          BOAT_BASE_URL: ${{ inputs.provider == 'boat' && (env.BOAT_BASE_URL || vars.BOAT_BASE_URL) || '' }}
          FREESTYLE_API_KEY: ${{ inputs.provider == 'freestyle' && secrets.FREESTYLE_API_KEY || '' }}
          BREZEL_API_KEY: ${{ inputs.provider == 'brezel' && secrets.BREZEL_API_KEY || '' }}
          BREZEL_API_URL: ${{ inputs.provider == 'brezel' && (env.BREZEL_API_URL || vars.BREZEL_API_URL) || '' }}
          BREZEL_PROJECT_ID: ${{ inputs.provider == 'brezel' && (env.BREZEL_PROJECT_ID || vars.BREZEL_PROJECT_ID) || '' }}
          BREZEL_ENVIRONMENT_REVISION: ${{ inputs.provider == 'brezel' && (env.BREZEL_ENVIRONMENT_REVISION || vars.BREZEL_ENVIRONMENT_REVISION) || '' }}
          # <<< end generated: provider-inputs-release
          VERCEL_CANDIDATE_IMAGE: ${{ steps.vercel-pinned.outputs.digest-ref || steps.vercel-vcr.outputs.digest-ref || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--provider "${PROVIDER}" --base-image "${BASE_IMAGE_REF}")
          # Required providers must not silently skip: --require fails the cell if this provider's
          # secret is missing/misnamed or it fails to validate.
          if [ "${REQUIRED}" = "true" ]; then args+=(--require "${PROVIDER}"); fi
          # Route the report JSON to a file via env (not a `> file` redirect): the provider CLIs inherit
          # stdout, so a redirect would splice their chatter into the report. bake.ts writes the file
          # even when it exits non-zero, so it's a clean diagnostic on failure too.
          export BAKE_REPORT_FILE="${PHASE}-${PROVIDER}.json"
          if [ "$PHASE" = promote ]; then
            args+=(--promote --stage-provider)
            if [ "$RELEASE_FORCE" = true ]; then args+=(--force); fi
          fi
          # Only a REQUIRED provider blocks the release: a required cell passed --require above, so
          # bake.ts exits non-zero (failing the cell) if it fails or skips. A NON-required cell — e.g.
          # daytona-container / modal-vm, which share a required variant's credentials and so can never
          # take the missing-creds skip path — still runs, but a failure is surfaced as a warning and
          # must NOT block the publish (its outcome is in the uploaded bake report either way).
          if [ "${REQUIRED}" = "true" ]; then
            bun apps/cli/src/bin/bake.ts "${args[@]}"
          else
            bun apps/cli/src/bin/bake.ts "${args[@]}" ||
              echo "::warning title=Non-required provider not validated::${PROVIDER} did not pass its bake/verify — reported, not blocking the release (best-effort variant)"
          fi
      - name: Ensure VCR logout
        if: always()
        shell: bash
        run: docker logout vcr.vercel.com || true
      - name: Upload bake report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.phase }}-${{ inputs.provider }}-${{ github.run_id }}
          path: ${{ inputs.phase }}-${{ inputs.provider }}.json
          if-no-files-found: warn
          overwrite: true

  namespace:
    if: inputs.account == 'namespace'
    environment: ${{ format('provider-{0}', inputs.account) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: benchmark-account-${{ inputs.account }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      id-token: write
    steps: *provider-steps
